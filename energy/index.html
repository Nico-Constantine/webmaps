<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet-control-geocoder.Geocoder.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>Ζήτηση Θέρμανσης</title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet-control-geocoder.Geocoder.js"></script>
        <script src="data/zhthsh_energeias_noikokyriwn_1.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[35.10984731797385,15.046482121705223],[41.94892650067953,30.957569944551977]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // add class to format popup if it contains media
		function addClassToPopupIfMedia(content, popup) {
			var tempDiv = document.createElement('div');
			tempDiv.innerHTML = content;
			if (tempDiv.querySelector('td img')) {
				popup._contentNode.classList.add('media');
					// Delay to force the redraw
					setTimeout(function() {
						popup.update();
					}, 10);
			} else {
				popup._contentNode.classList.remove('media');
			}
		}
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_OSMStandard_0');
        map.getPane('pane_OSMStandard_0').style.zIndex = 400;
        var layer_OSMStandard_0 = L.tileLayer('http://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            pane: 'pane_OSMStandard_0',
            opacity: 1.0,
            attribution: '<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors, CC-BY-SA</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        layer_OSMStandard_0;
        map.addLayer(layer_OSMStandard_0);
        function pop_zhthsh_energeias_noikokyriwn_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">H_NOIK</th>\
                        <td class="visible-with-data" id="H_NOIK">' + (feature.properties['H_NOIK'] !== null ? autolinker.link(String(feature.properties['H_NOIK']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">WR_NOIK</th>\
                        <td class="visible-with-data" id="WR_NOIK">' + (feature.properties['WR_NOIK'] !== null ? autolinker.link(String(feature.properties['WR_NOIK']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_zhthsh_energeias_noikokyriwn_1_0(feature) {
            if (feature.properties['H_NOIK'] >= 0.000000 && feature.properties['H_NOIK'] <= 1000000.000000 ) {
                return {
                pane: 'pane_zhthsh_energeias_noikokyriwn_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(0,255,0,1.0)',
                interactive: true,
            }
            }
            if (feature.properties['H_NOIK'] >= 1000000.000000 && feature.properties['H_NOIK'] <= 10000000.000000 ) {
                return {
                pane: 'pane_zhthsh_energeias_noikokyriwn_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(64,191,0,1.0)',
                interactive: true,
            }
            }
            if (feature.properties['H_NOIK'] >= 10000000.000000 && feature.properties['H_NOIK'] <= 100000000.000000 ) {
                return {
                pane: 'pane_zhthsh_energeias_noikokyriwn_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(128,128,0,1.0)',
                interactive: true,
            }
            }
            if (feature.properties['H_NOIK'] >= 100000000.000000 && feature.properties['H_NOIK'] <= 1000000000.000000 ) {
                return {
                pane: 'pane_zhthsh_energeias_noikokyriwn_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(191,64,0,1.0)',
                interactive: true,
            }
            }
            if (feature.properties['H_NOIK'] >= 1000000000.000000 && feature.properties['H_NOIK'] <= 10000000000.000000 ) {
                return {
                pane: 'pane_zhthsh_energeias_noikokyriwn_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,0,0,1.0)',
                interactive: true,
            }
            }
        }
        map.createPane('pane_zhthsh_energeias_noikokyriwn_1');
        map.getPane('pane_zhthsh_energeias_noikokyriwn_1').style.zIndex = 401;
        map.getPane('pane_zhthsh_energeias_noikokyriwn_1').style['mix-blend-mode'] = 'normal';
        var layer_zhthsh_energeias_noikokyriwn_1 = new L.geoJson(json_zhthsh_energeias_noikokyriwn_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_zhthsh_energeias_noikokyriwn_1',
            layerName: 'layer_zhthsh_energeias_noikokyriwn_1',
            pane: 'pane_zhthsh_energeias_noikokyriwn_1',
            onEachFeature: pop_zhthsh_energeias_noikokyriwn_1,
            style: style_zhthsh_energeias_noikokyriwn_1_0,
        });
        bounds_group.addLayer(layer_zhthsh_energeias_noikokyriwn_1);
        map.addLayer(layer_zhthsh_energeias_noikokyriwn_1);
        var osmGeocoder = new L.Control.Geocoder({
            collapsed: true,
            position: 'topleft',
            text: 'Search',
            title: 'Testing'
        }).addTo(map);
        document.getElementsByClassName('leaflet-control-geocoder-icon')[0]
        .className += ' fa fa-search';
        document.getElementsByClassName('leaflet-control-geocoder-icon')[0]
        .title += 'Search for a place';
        setBounds();
        </script>
    </body>
</html>
